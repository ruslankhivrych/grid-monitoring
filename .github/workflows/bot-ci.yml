name: Bot CI

on:
  push:
    paths:
      - 'bot/**'
      - 'deploy/windows/**'
      - '.github/workflows/bot-ci.yml'
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r deploy/windows/requirements.txt pytest pip-audit
      - name: Verify dependency graph
        run: pip check
      - name: Audit dependencies
        run: pip-audit -r deploy/windows/requirements.txt
      - name: Syntax check
        run: python -m compileall bot/src
      - name: Run tests
        run: pytest bot/tests -q
      - name: Build Docker image
        run: docker build -t felicity-grid-bot:test bot
